# Stable-hostname vhost for OpenReply.
#
# The existing `openreply` vhost stays as `default_server` on :80 so traffic
# arriving through the Cloudflare tunnel (which sends a *.trycloudflare.com Host
# header) keeps working while the permanent URL is being cut over.
#
# This block owns the permanent hostname only. certbot attaches the :443
# listener and certificate paths to it.

server {
    listen 80;
    listen [::]:80;
    server_name 80-225-220-80.sslip.io;

    # Let certbot answer HTTP-01 challenges from disk rather than proxying
    # them into Next.js, which would 404 them.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
